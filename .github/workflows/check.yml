name: check
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: sudo apt-get install -y --no-install-recommends graphviz z3
      - name: Build OpenSysML at the pinned commit and fetch the pinned pilot validators
        run: make tools
      - run: make tiers
      - run: make check
